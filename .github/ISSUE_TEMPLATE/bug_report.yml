name: Bug report
description: Report a reproducible error or unexpected behavior.
title: "[Bug] "
labels:
  - bug
body:
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Client
        - Server
        - Contracts
        - Documentation
        - Infrastructure
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Description
      description: Briefly describe what went wrong.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps required to reproduce the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages or logs after removing sensitive information.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS:
        - Unity or .NET version:
        - Branch/commit:
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add screenshots, videos, related issues, or other useful context.

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Select the impact of this issue.
      options:
        - Critical - blocks development or release
        - High - major feature is unavailable
        - Medium - feature works with limitations
        - Low - minor or cosmetic issue
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I searched for existing issues before submitting this report.
          required: true
        - label: I removed secrets, tokens, and personal data from the attached logs.
          required: true

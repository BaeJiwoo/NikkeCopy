name: Feature request
description: Suggest a new feature or improvement.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: dropdown
    id: area
    attributes:
      label: Target area
      options:
        - Client
        - Server
        - Contracts
        - Documentation
        - Infrastructure
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: Motivation
      description: Describe the problem to solve and why this change is needed.
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: Describe measurable acceptance criteria.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the expected behavior, UI flow, or API design if applicable.

  - type: textarea
    id: related
    attributes:
      label: Additional context
      description: Add related documents, issues, designs, or reference links.

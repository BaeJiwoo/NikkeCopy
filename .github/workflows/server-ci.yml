name: Server CI

on:
  push:
    paths:
      - "Server/**"
      - "NikkeCopy.slnx"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "Server/**"
      - "NikkeCopy.slnx"
      - ".github/workflows/server-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore NikkeCopy.slnx

      - name: Build
        run: dotnet build NikkeCopy.slnx --configuration Release --no-restore
